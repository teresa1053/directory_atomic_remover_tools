[project]
name = "directory-atomic-remover-tools"
version = "0.1.0"
description = "Swap a directory for an empty one without readers seeing a half-deleted tree."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
